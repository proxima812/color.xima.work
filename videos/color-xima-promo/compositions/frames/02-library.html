        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.44, ease: "power3.out" }, 0.18);

      /* deterministic count-up 0 -> 465 */
      const count = { v: 0 };
      let numEl = null;
      const writeNum = function () {
        if (!numEl) { numEl = document.getElementById("s2-num"); }
        if (numEl) { numEl.textContent = Math.round(count.v); }
      };
      /* modifiers run on every render, including seeks that suppress callbacks,
         so the digits stay correct whether the runtime plays or scrubs. */
      const applyNum = function (v) {
        const n = Math.round(v);
        if (!numEl) { numEl = document.getElementById("s2-num"); }
        if (numEl) { numEl.textContent = n; }
        return n;
      };
      tl.fromTo(count,
        { v: 0 },
        { v: 465, duration: 1.12, ease: "power3.out",
          modifiers: { v: applyNum }, onUpdate: writeNum, onComplete: writeNum }, 0.10);

      /* browser mockup rises in */
      tl.fromTo("#s2-zoom",
        { y: 130, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.66, ease: "power4.out" }, 0.16);

      /* ambient bloom behind it */
      tl.fromTo("#s2-halo",
        { opacity: 0, scale: 0.9, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 1.1, ease: "power2.out" }, 0.24);

      /* chrome details */
      tl.fromTo("#s2-dots span",
        { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "power3.out", stagger: 0.05 }, 0.44);

      tl.fromTo("#s2-url",
        { opacity: 0, y: -10 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 0.48);

      /* the library fills in, tile by tile */
      tl.fromTo("#s2-grid .tile",
        { opacity: 0, scale: 0.82, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.28, ease: "power3.out",
          stagger: { amount: 0.30, from: "start" } }, 0.26);

      /* endless upward scroll inside the mockup */
      tl.fromTo("#s2-grid",
        { y: 0 },
        { y: -300, duration: 2.72, ease: "none" }, 0.28);

      window.__timelines["s2"] = tl;
    })();
  </script>
