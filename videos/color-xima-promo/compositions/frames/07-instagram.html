      #s7-root .s7-veil {

    <div id="s7-scene" class="clip" data-start="0" data-duration="2.7" data-track-index="1">

  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      const tl = gsap.timeline({ paused: true });

      /* ---- padding readout starts on "6 px" ------------------------------ */
      tl.set("#s7-v1", { opacity: 1 }, 0)
        .set(["#s7-v2", "#s7-v3", "#s7-v4"], { opacity: 0 }, 0);

      /* ---- card + ambient ------------------------------------------------ */
      tl.fromTo("#s7-card",
        { opacity: 0 },
        { opacity: 1, duration: 0.22, ease: "power2.out" }, 0);

      tl.fromTo("#s7-card",
        { y: 62 },
        { y: 0, duration: 0.52, ease: "power3.out" }, 0);

      tl.fromTo("#s7-halo",
        { opacity: 0, scale: 0.88, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1.04, transformOrigin: "50% 50%", duration: 2.6, ease: "power2.out" }, 0.02);

      /* ---- beat 1 : the wide gradient panel ------------------------------ */
      tl.fromTo("#s7-panel",
        { opacity: 0, scale: 1.07, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.44, ease: "power3.out" }, 0.08);

      /* ---- display copy, three lines 0.12s apart -------------------------- */
      tl.fromTo("#s7-l1",
        { opacity: 0, y: 28, filter: "blur(12px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.34, ease: "power3.out" }, 0.06);

      tl.fromTo("#s7-l2",
        { opacity: 0, y: 28, filter: "blur(12px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.34, ease: "power3.out" }, 0.18);

      tl.fromTo("#s7-l3",
        { opacity: 0, y: 28, filter: "blur(12px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.34, ease: "power3.out" }, 0.30);

      /* ---- beat 2 : the 9:16 frame SNAPS over the panel ------------------ */
      tl.fromTo("#s7-frame",
        { opacity: 0 },
        { opacity: 1, duration: 0.07, ease: "power2.out" }, 0.62);

      tl.fromTo("#s7-frame",
        { scale: 1.25, transformOrigin: "50% 50%" },
        { scale: 1, transformOrigin: "50% 50%", duration: 0.22, ease: "power4.out" }, 0.62);

      /* the border flashes white on the snap, then decays */
      tl.fromTo("#s7-flash",
        { opacity: 0 },
        { opacity: 1, duration: 0.06, ease: "power2.out" }, 0.62);

      tl.fromTo("#s7-flash",
        { opacity: 1 },
        { opacity: 0, duration: 0.34, ease: "power2.in" }, 0.72);

      /* the crop: everything outside the frame falls away */
      tl.fromTo(["#s7-veil-l", "#s7-veil-r"],
        { opacity: 0 },
        { opacity: 1, duration: 0.30, ease: "power2.out" }, 0.68);

      tl.fromTo("#s7-ratio",
        { opacity: 0, y: -10 },
        { opacity: 1, y: 0, duration: 0.26, ease: "power3.out" }, 0.86);

      /* ---- controls row + button arrive ---------------------------------- */
      tl.fromTo("#s7-ctl",
        { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, 0.90);

      tl.fromTo("#s7-btn",
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 1.02);

      /* ---- beat 3 : padding slider drags, preview visibly insets ---------- */
      /* knob x is the fraction along the 520px track (knob left = track-16),
         so knob, fill and preview stay numerically locked together */
      tl.fromTo("#s7-knob",
        { x: 93.6 },
        { x: 322.4, duration: 0.44, ease: "power3.inOut" }, 1.32);

      tl.fromTo("#s7-fill",
        { scaleX: 0.18, transformOrigin: "0% 50%" },
        { scaleX: 0.62, transformOrigin: "0% 50%", duration: 0.44, ease: "power3.inOut" }, 1.32);

      /* padding is faked by scaling the shot wrapper, never by tweening the
         padding property: a uniform 6px -> 24px inset on a 306x544 frame
         (306-12)/306=0.9608  (544-12)/544=0.9779
         (306-48)/306=0.8431  (544-48)/544=0.9118 */
      tl.fromTo("#s7-shotwrap",
        { scaleX: 0.9608, scaleY: 0.9779, transformOrigin: "50% 50%" },
        { scaleX: 0.8431, scaleY: 0.9118, transformOrigin: "50% 50%", duration: 0.44, ease: "power3.inOut" }, 1.32);

      /* live readout — hard cuts placed against the power3.inOut curve */
      tl.set("#s7-v1", { opacity: 0 }, 1.50).set("#s7-v2", { opacity: 1 }, 1.50);
      tl.set("#s7-v2", { opacity: 0 }, 1.56).set("#s7-v3", { opacity: 1 }, 1.56);
      tl.set("#s7-v3", { opacity: 0 }, 1.64).set("#s7-v4", { opacity: 1 }, 1.64);

      /* ---- beat 4 : download pulses once, arrow nudges down 6px and back -- */
      tl.fromTo("#s7-sheen",
        { x: -140, skewX: -16 },
        { x: 1060, skewX: -16, duration: 0.66, ease: "power2.inOut" }, 1.92);

      tl.fromTo("#s7-btn",
        { scale: 1, transformOrigin: "50% 50%" },
        { scale: 1.035, transformOrigin: "50% 50%", duration: 0.14, ease: "power2.out" }, 1.95);

      tl.fromTo("#s7-btn",
        { scale: 1.035, transformOrigin: "50% 50%" },
        { scale: 1, transformOrigin: "50% 50%", duration: 0.28, ease: "power3.out" }, 2.09);

      tl.fromTo("#s7-arrow",
        { y: 0 },
        { y: 6, duration: 0.13, ease: "power2.in" }, 1.98);

      tl.fromTo("#s7-arrow",
        { y: 6 },
        { y: 0, duration: 0.30, ease: "power3.out" }, 2.11);

      window.__timelines["s7"] = tl;
    })();
  </script>
